name: Windows installation directory regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directory:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Compile the actual native directory preparer
        run: node scripts/build-native.mjs
      - name: Reproduce absent drive-root directory and NSIS-owned empty directory
        run: node .github/scripts/probe-windows-install-directory.mjs 2>&1 | tee .desktop-build/directory-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-directory-regression-${{ github.sha }}
          path: .desktop-build/directory-regression.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
