name: Windows wrapper diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crabot-win32-x64-offline-test-58f39f1f047600ea764e7508b20ebc9252efb557
          run-id: 40988215419
          github-token: ${{ github.token }}
          path: artifact
      - name: Diagnose actual wrapper copy
        shell: pwsh
        run: .github/scripts/diagnose-windows-wrapper.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wrapper-diagnostic
          path: wrapper-diagnostic.json
