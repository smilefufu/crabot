name: Desktop Windows uninstall entry
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-application']
    paths:
      - 'crabot-native/src/desktop-uninstall.h'
      - '.github/scripts/probe-windows-uninstall-entry.mjs'
      - '.github/workflows/desktop-windows-uninstall-probe.yml'
permissions:
  contents: read
jobs:
  uninstall-entry:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Compile the same-source native helper
        run: node scripts/build-native.mjs
      - name: Verify only the disposable installation registry key
        run: node .github/scripts/probe-windows-uninstall-entry.mjs
      - name: Install only the frozen Node test dependencies
        run: pnpm install --frozen-lockfile
      - name: Real finite Windows removal and unchanged-document cost
        timeout-minutes: 3
        run: node --test --test-name-pattern="one unchanged destructive admission|warmed removal facts|finite many-file removal|program removal holds|generic stopped facts" scripts/lib/__tests__/desktop-removal-programs.test.mjs
