name: Slack CI

on:
  workflow_dispatch:
    inputs:
      windows_feedback:
        description: 'Only native Slack process and configuration feedback regressions'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'crabot-channel-slack/**'
      - 'crabot-shared/src/onboarder.ts'
      - 'crabot-admin/src/*onboard*'
      - 'crabot-admin/src/channel-manager*'
      - 'crabot-admin/src/index.ts'
      - 'crabot-admin/src/types.ts'
      - 'crabot-admin/web/src/pages/Channels/*Onboarding*'
      - 'crabot-admin/web/src/services/channel.ts'
      - 'crabot-admin/web/src/types/index.ts'
      - '.github/scripts/smoke-slack-onboarding.mjs'
      - '.github/workflows/slack-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-feedback:
    if: inputs.windows_feedback == true
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build native Slack process dependencies
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-shared install --frozen-lockfile
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-channel-slack install --frozen-lockfile
          pnpm --dir crabot-channel-slack run build
          pnpm --dir crabot-agent install --frozen-lockfile
          pnpm --dir crabot-channel-wechat install --frozen-lockfile
          pnpm --dir crabot-agent run build
          pnpm --dir crabot-channel-wechat run build
      - name: Native supervised configuration and console visibility
        run: pnpm --dir crabot-channel-slack test
      - name: Agent media pipeline and existing WeChat image behavior
        run: |
          pnpm --dir crabot-agent exec vitest run tests/engine/query-loop.test.ts tests/mcp/fetch-image.test.ts tests/agent/outbound-dispatch.test.ts tests/mcp/crab-messaging-get-message-media.test.ts tests/mcp/crab-messaging-fetch-media.test.ts tests/mcp/crab-messaging-tool-set.test.ts --maxWorkers=2 --minWorkers=1
          pnpm --dir crabot-channel-wechat exec vitest run tests/wechat-image-fetch.test.ts
      - name: Official Slack CLI project hooks
        if: ${{ !cancelled() }}
        run: node .github/scripts/smoke-slack-onboarding.mjs
  slack:
    if: inputs.windows_feedback != true
    name: Slack (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Install dependencies (with devDeps for build)
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile
          pnpm --dir crabot-client run build
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile

          # crabot-shared 必须先 install + build，其他模块通过 file: 引用它。
          # pnpm 对 file: 依赖在 install 时做快照复制，所以其他模块必须在
          # crabot-shared 已有 dist/ 之后再 install，否则拿到的是空快照。
          (cd crabot-shared && pnpm install && pnpm run build)

          # 其他模块并行 install（pnpm store 缓存共享，并发安全）
          pids=()
          for mod in crabot-core crabot-agent \
                     crabot-channel-telegram crabot-channel-wechat crabot-channel-feishu crabot-channel-dingtalk crabot-channel-slack crabot-channel-voice \
                     crabot-mcp-tools crabot-admin; do
            if [ -d "$mod" ]; then
              (cd "$mod" && pnpm install) &
              pids+=($!)
            fi
          done
          for pid in "${pids[@]}"; do wait "$pid" || exit 1; done

      - name: Build all modules in parallel
        shell: bash
        run: |
          pids=()
          for mod in crabot-core crabot-agent \
                     crabot-channel-telegram crabot-channel-wechat crabot-channel-feishu crabot-channel-dingtalk crabot-channel-slack crabot-channel-voice \
                     crabot-mcp-tools; do
            if [ -d "$mod" ]; then
              (cd "$mod" && pnpm run build) &
              pids+=($!)
            fi
          done
          # 根 CLI 构建独立
          pnpm run build:cli &
          pids+=($!)
          for pid in "${pids[@]}"; do wait "$pid" || exit 1; done

          # admin: 后端 build → 前端 build:web（顺序执行，build:web 会进入 web/ 子项目自己 install）
          (cd crabot-admin && pnpm run build && pnpm run build:web)

      - name: Native process helper and background lifecycle
        shell: bash
        run: |
          node scripts/build-native.mjs
          node --test scripts/lib/__tests__/background-core.test.mjs scripts/lib/__tests__/core-preflight.test.mjs scripts/lib/__tests__/desktop-data-import.test.mjs
          pnpm --dir crabot-core exec vitest run src/process-tree-windows.test.ts src/module-runtime-registry.test.ts --maxWorkers=1 --minWorkers=1

      - name: Windows native fixed proxy discovery
        if: runner.os == 'Windows'
        shell: bash
        run: CRABOT_SYSTEM_PROXY_CI=1 node .github/scripts/probe-windows-system-proxy.mjs

      - name: Slack channel and process regressions
        shell: bash
        run: pnpm --dir crabot-channel-slack test

      - name: Agent media pipeline and existing WeChat image behavior
        shell: bash
        run: |
          pnpm --dir crabot-agent exec vitest run tests/engine/query-loop.test.ts tests/mcp/fetch-image.test.ts tests/agent/outbound-dispatch.test.ts tests/mcp/crab-messaging-get-message-media.test.ts tests/mcp/crab-messaging-fetch-media.test.ts tests/mcp/crab-messaging-tool-set.test.ts --maxWorkers=2 --minWorkers=1
          pnpm --dir crabot-channel-wechat exec vitest run tests/wechat-image-fetch.test.ts

      - name: Official Slack CLI native hooks
        shell: bash
        run: node .github/scripts/smoke-slack-onboarding.mjs

      - name: Windows data copy comparison
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git fetch --no-tags origin 059eaf466ebd4bef2f338a716d32ad53ebcfe5e7
          node .github/scripts/probe-windows-data-copy-performance.mjs

      - name: Admin onboarding regressions
        shell: bash
        run: pnpm --dir crabot-admin exec vitest run src/slack-onboarding-http.test.ts src/slack-onboarding-sessions.test.ts src/channel-manager.slack.test.ts src/onboard-finish-response.test.ts src/onboarding-master.test.ts --maxWorkers=2 --minWorkers=1

      - name: Web onboarding regressions
        shell: bash
        run: pnpm --dir crabot-admin/web exec vitest run src/pages/Channels/SlackLocalOnboarding.test.tsx --maxWorkers=2 --minWorkers=1
