name: Desktop Electron lifecycle
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-electron-lifecycle']
  pull_request:
    paths:
      - 'crabot-desktop/**'
      - '.github/workflows/desktop-electron-lifecycle.yml'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's actual SDK, Shared, Native and internal host
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/build-native.mjs
          pnpm --dir crabot-desktop install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-desktop exec node node_modules/electron/install.js
          pnpm --dir crabot-desktop run build
          pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin/web install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin/web run build
          mkdir -p .desktop-build
      - name: Prepare exact development Electron sandbox in isolated Ubuntu CI
        if: runner.os == 'Linux'
        run: node .github/scripts/ubuntu-electron-test-sandbox.mjs
      - name: Verify original components and actual sandboxed window boundaries
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node --test --test-concurrency=1 crabot-desktop/tests/artifact-network.test.mjs crabot-desktop/tests/bootstrap-log.test.mjs crabot-desktop/tests/controller.test.mjs crabot-desktop/tests/desktop-ipc.test.mjs crabot-desktop/tests/desktop-network.test.mjs crabot-desktop/tests/diagnostics.test.mjs crabot-desktop/tests/electron-boundary.test.mjs crabot-desktop/tests/installer-progress.test.mjs crabot-desktop/tests/local-pages.test.mjs crabot-desktop/tests/login-startup-update.test.mjs crabot-desktop/tests/login-startup.test.mjs crabot-desktop/tests/maintenance-bootstrap.test.mjs crabot-desktop/tests/paired-handoff.test.mjs crabot-desktop/tests/paired-update.test.mjs crabot-desktop/tests/release-download.test.mjs crabot-desktop/tests/release-signatures.test.mjs crabot-desktop/tests/removal-operation.test.mjs crabot-desktop/tests/removal-request.test.mjs crabot-desktop/tests/session-host.test.mjs crabot-desktop/tests/ubuntu-installation.test.mjs crabot-desktop/tests/ubuntu-process.test.mjs crabot-desktop/tests/ubuntu-update.test.mjs crabot-desktop/tests/update-dialog.test.mjs crabot-desktop/tests/update-package.test.mjs crabot-desktop/tests/workspace-folder.test.mjs
          else
            node --test --test-concurrency=1 crabot-desktop/tests/artifact-network.test.mjs crabot-desktop/tests/bootstrap-log.test.mjs crabot-desktop/tests/controller.test.mjs crabot-desktop/tests/desktop-ipc.test.mjs crabot-desktop/tests/desktop-network.test.mjs crabot-desktop/tests/diagnostics.test.mjs crabot-desktop/tests/electron-boundary.test.mjs crabot-desktop/tests/installer-progress.test.mjs crabot-desktop/tests/local-pages.test.mjs crabot-desktop/tests/login-startup-update.test.mjs crabot-desktop/tests/login-startup.test.mjs crabot-desktop/tests/maintenance-bootstrap.test.mjs crabot-desktop/tests/paired-handoff.test.mjs crabot-desktop/tests/paired-update.test.mjs crabot-desktop/tests/release-download.test.mjs crabot-desktop/tests/release-signatures.test.mjs crabot-desktop/tests/removal-operation.test.mjs crabot-desktop/tests/removal-request.test.mjs crabot-desktop/tests/session-host.test.mjs crabot-desktop/tests/ubuntu-installation.test.mjs crabot-desktop/tests/ubuntu-process.test.mjs crabot-desktop/tests/ubuntu-update.test.mjs crabot-desktop/tests/update-dialog.test.mjs crabot-desktop/tests/update-package.test.mjs crabot-desktop/tests/workspace-folder.test.mjs
          fi
