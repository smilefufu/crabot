name: Verify exact release downloads
on:
  workflow_dispatch:
    inputs:
      public:
        description: 'Verify anonymous public downloads after publication; false verifies the draft'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFY_PUBLIC: ${{ inputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74dec3c55d7b17196ea851ca994c2e12e805f151
      - name: Verify all final assets, sidecars, native gates and exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 74dec3c55d7b17196ea851ca994c2e12e805f151
          python3 - <<'PY'
          import datetime,hashlib,json,os,re,subprocess,tempfile,urllib.request,urllib.parse
          from pathlib import Path
          tag='v2026.11.11.1'; source='74dec3c55d7b17196ea851ca994c2e12e805f151'; public=os.environ['VERIFY_PUBLIC']=='true'
          def gh(*args):return subprocess.check_output(['gh',*args],text=True)
          runs=[42986083675,42986088193,42986079303,42986092889,42987118794,42988973454]
          upgrade_jobs=json.loads(gh('run','view','42988080061','--repo','smilefufu/crabot','--json','jobs'))['jobs']
          upgrade_evidence={}
          for target in ['win32-x64','linux-x64']:
            matches=[job for job in upgrade_jobs if job['name'].startswith('upgrade ('+target+',')]
            assert len(matches)==1 and matches[0]['conclusion']=='success',(target,matches)
            upgrade_evidence[target]={'run':42988080061,'job':matches[0]['databaseId'],'conclusion':'success'}
          upgrade_evidence['macos']={'run':42988973454,'baseline_fixture_correction':'Dispose owned GUI after confirmed normal service stop; preserve failed SIGTERM fixture run42988080061'}
          for run in runs:assert gh('run','view',str(run),'--repo','smilefufu/crabot','--json','conclusion','--jq','.conclusion').strip()=='success',run
          releases=json.loads(gh('api','repos/smilefufu/crabot/releases'))
          matches=[v for v in releases if v['tag_name']==tag]
          assert len(matches)==1,'Expected one tagged release visible to this token; draft access requires repository write permission'
          release=matches[0]
          assert release['draft']==(not public) and release['prerelease'] is False
          assert release['target_commitish']==source
          if public:
            ref=json.loads(gh('api','repos/smilefufu/crabot/git/ref/tags/'+tag))['object']
            if ref['type']=='tag':ref=json.loads(gh('api','repos/smilefufu/crabot/git/tags/'+ref['sha']))['object']
            assert ref['type']=='commit' and ref['sha']==source
          if public:assert json.loads(gh('api','repos/smilefufu/crabot/releases/latest'))['tag_name']==tag
          desktop=['Crabot-0.1.0-desktop.26-mac-arm64-candidate.dmg','Crabot-0.1.0-desktop.26-mac-x64-candidate.dmg','Crabot-0.1.0-desktop.26-win-x64-offline-candidate.exe','Crabot-0.1.0-desktop.26-linux-amd64-candidate.deb']
          cli=['crabot-'+tag+'-'+platform+extension for platform,extension in [('darwin-arm64','.tar.gz'),('darwin-x64','.tar.gz'),('linux-x64','.tar.gz'),('windows-x64','.zip')]]
          packages=desktop+cli; expected=set(packages+[name+'.sha256' for name in packages]+['desktop.26-verification.json'])
          assets={item['name']:item for item in release['assets']};assert set(assets)==expected,sorted(set(assets)^expected)
          results={}; small={}
          for name,asset in sorted(assets.items()):
            assert asset['state']=='uploaded' and asset['size']>0,name
            digest=hashlib.sha256(); size=0; keep=bytearray(); status=None
            url='https://github.com/smilefufu/crabot/releases/download/'+tag+'/'+urllib.parse.quote(name)
            if public:
              with urllib.request.urlopen(url,timeout=120) as response:
                status=response.status;assert status==200,(name,status)
                while chunk:=response.read(1024*1024):
                  digest.update(chunk);size+=len(chunk)
                  if name.endswith(('.sha256','.json')):keep.extend(chunk);assert len(keep)<512*1024
            else:
              with tempfile.TemporaryDirectory(prefix='release-asset-') as directory:
                subprocess.run(['gh','release','download',tag,'--repo','smilefufu/crabot','--pattern',name,'--dir',directory],check=True,timeout=1200)
                with (Path(directory)/name).open('rb') as stream:
                  while chunk:=stream.read(1024*1024):
                    digest.update(chunk);size+=len(chunk)
                    if name.endswith(('.sha256','.json')):keep.extend(chunk);assert len(keep)<512*1024
            sha=digest.hexdigest();assert size==asset['size'],name
            assert asset['digest']=='sha256:'+sha,(name,'GitHub digest mismatch')
            results[name]={'bytes':size,'sha256':sha,'http_status':status,'url':url if public else None}
            if keep:small[name]=bytes(keep)
            print('ASSET_VERIFIED '+json.dumps({'name':name,**results[name]}),flush=True)
          for name in packages:
            match=re.fullmatch(r'([0-9a-fA-F]{64})(?:\s+\*?(.+))?',small[name+'.sha256'].decode('utf-8-sig').strip())
            assert match and match[1].lower()==results[name]['sha256'],name
            assert match[2] is None or match[2]==name,name
          desktop_receipt=json.loads(small['desktop.26-verification.json'])
          assert desktop_receipt['source_commit']==source and desktop_receipt['desktop_version']=='0.1.0-desktop.26'
          assert {item['file'] for item in desktop_receipt['files']}==set(desktop)
          for item in desktop_receipt['files']:assert (item['sha256'],item['bytes'])==(results[item['file']]['sha256'],results[item['file']]['bytes'])
          receipt={'tag':tag,'source_commit':source,'phase':'public' if public else 'draft','verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'native_acceptance_runs':runs,'upgrade_acceptance':upgrade_evidence,'mac_cli_ci_trust':'Explicit CURL_CA_BUNDLE with unchanged locked certifi; original default-host example.com static TLS failure retained in release notes and diagnostic42759268758. Product default trust unchanged.','assets':results}
          output=Path('release-public-verification.json' if public else 'release-draft-verification.json')
          output.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('RELEASE_VERIFIED '+json.dumps({'phase':receipt['phase'],'tag':tag,'packages':len(packages),'assets':len(results),'source':source}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.public && 'public' || 'draft' }}-verification
          path: release-*-verification.json
          if-no-files-found: error
