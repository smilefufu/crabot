name: Release transport diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-mac:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crabot-darwin-arm64-offline-test-45ac91532d4308c48ec936f4149d7d56ef437eec
          run-id: 42750399454
          github-token: ${{ github.token }}
          path: candidate
      - name: Inspect HTTPS using the exact sealed candidate Python and packages
        shell: bash
        run: |
          dmg=$(find candidate -name '*candidate.dmg' -print -quit)
          mount="$RUNNER_TEMP/inspect-candidate"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          core="$mount/Crabot.app/Contents/Resources/core"
          runtime=$(node -p 'const fs=require("fs");fs.realpathSync(process.argv[1]+"/"+JSON.parse(fs.readFileSync(process.argv[1]+"/scrapling-runtime.json")).directory)' "$core")
          "$runtime/python/bin/python3.12" -I -B - "$runtime" <<'PY'
          import sys, pathlib, hashlib, ssl, urllib.request, socket
          root=pathlib.Path(sys.argv[1]); sys.path.insert(0,str(root/'packages'))
          import curl_cffi, curl_cffi.curl, certifi
          print('PACKAGED_TLS',sys.version,ssl.OPENSSL_VERSION,flush=True)
          for label,file in [('curl',curl_cffi.curl.DEFAULT_CACERT),('certifi',certifi.where())]:
            p=pathlib.Path(file); print('PACKAGED_CA',label,str(p),hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          for url in ['https://example.com','https://github.com','https://docs.python.org','https://www.baidu.com']:
            for label,ca in [('default',True),('certifi',certifi.where())]:
              try:
                r=curl_cffi.requests.get(url,verify=ca,timeout=15); print('PACKAGED_CURL',url,label,r.status_code,flush=True)
              except Exception as e: print('PACKAGED_CURL_ERROR',url,label,str(e),flush=True)
            try:
              with urllib.request.urlopen(url,context=ssl.create_default_context(cafile=certifi.where()),timeout=15) as r: print('PACKAGED_URLLIB',url,r.status,flush=True)
            except Exception as e: print('PACKAGED_URLLIB_ERROR',url,str(e),flush=True)
            try:
              host=url.split('/')[2]
              with socket.create_connection((host,443),timeout=15) as raw, ssl.create_default_context(cafile=certifi.where()).wrap_socket(raw,server_hostname=host) as tls:
                peer=tls.getpeercert(); print('VERIFIED_PEER',host,peer.get('issuer'),peer.get('notAfter'),flush=True)
            except Exception as e: print('VERIFIED_PEER_ERROR',url,str(e),flush=True)
          PY
          node --input-type=module - "$core" <<'NODE'
          import {createRequire} from 'node:module'; import path from 'node:path'; import os from 'node:os'; import fs from 'node:fs/promises';
          const root=process.argv[2], require=createRequire(path.join(root,'crabot-agent/package.json'));
          const {Client}=require('@modelcontextprotocol/sdk/client/index.js');
          const {StdioClientTransport}=require('@modelcontextprotocol/sdk/client/stdio.js');
          const {resolveScraplingConfig}=require(path.join(root,'scripts/lib/scrapling-runtime.cjs'));
          const scratch=await fs.mkdtemp(path.join(os.tmpdir(),'release-https-scope-'));
          const config=resolveScraplingConfig(root,scratch,{is_builtin:true,name:'scrapling',transport:'stdio',command:'scrapling',args:['mcp']},{name:'scrapling'});
          const transport=new StdioClientTransport({command:config.command,args:config.args,env:{...process.env,...config.env,CRABOT_SCRAPLING_SYSTEM:'1'},stderr:'inherit'});
          const client=new Client({name:'release-https-scope',version:'1'},{capabilities:{}});
          try {
            await client.connect(transport);
            for(const url of ['https://example.com','https://github.com','https://docs.python.org','https://www.baidu.com']) {
              for(const name of ['make_request','fetch','stealthy_fetch']) {
                try {
                  const args={url,extraction_type:'text',...(name==='make_request'?{}:{google_search:false})};
                  const result=await client.callTool({name,arguments:args},undefined,{timeout:120000});
                  console.log('ACTUAL_MCP_HTTPS '+JSON.stringify({url,tool:name,passed:!result.isError,output_bytes:JSON.stringify(result).length}));
                } catch(error){console.log('ACTUAL_MCP_HTTPS '+JSON.stringify({url,tool:name,passed:false,error:String(error)}))}
              }
            }
          } finally {await client.close();await fs.rm(scratch,{recursive:true,force:true})}
          NODE
