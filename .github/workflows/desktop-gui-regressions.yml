name: Desktop isolated GUI regressions
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-gui-regressions']
  pull_request:
    paths:
      - 'crabot-desktop/**'
      - '.github/workflows/desktop-gui-regressions.yml'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's actual SDK, Shared, Native and internal host
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/build-native.mjs
          pnpm --dir crabot-desktop install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-desktop exec node node_modules/electron/install.js
          pnpm --dir crabot-desktop run build
          pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin/web install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin/web run build
          mkdir -p .desktop-build
      - name: Prepare exact development Electron sandbox in isolated Ubuntu CI
        if: runner.os == 'Linux'
        run: node .github/scripts/ubuntu-electron-test-sandbox.mjs
      - name: Verify exact installed entries, delayed startup and paired GUI boundaries
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node --test --test-concurrency=1 crabot-desktop/tests/installation-probe.test.mjs crabot-desktop/tests/installation-removal.test.mjs crabot-desktop/tests/login-startup-recovery.test.mjs crabot-desktop/tests/paired-binding.test.mjs crabot-desktop/tests/paired-relaunch.test.mjs crabot-desktop/tests/paired-update-gate.test.mjs
          else
            node --test --test-concurrency=1 crabot-desktop/tests/installation-probe.test.mjs crabot-desktop/tests/installation-removal.test.mjs crabot-desktop/tests/login-startup-recovery.test.mjs crabot-desktop/tests/paired-binding.test.mjs crabot-desktop/tests/paired-relaunch.test.mjs crabot-desktop/tests/paired-update-gate.test.mjs
          fi
