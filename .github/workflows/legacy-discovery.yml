name: Read-only legacy installation discovery
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-legacy-discovery']
  pull_request:
    paths:
      - 'scripts/lib/legacy-desktop.mjs'
      - 'scripts/lib/legacy-release-*.mjs'
      - 'scripts/desktop/legacy-releases.json'
      - 'scripts/lib/__tests__/legacy-desktop.test.mjs'
      - 'scripts/lib/__tests__/fixtures/legacy-release*'
      - '.github/workflows/legacy-discovery.yml'
permissions:
  contents: read
jobs:
  discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build only this checkout's actual Native dependency
        run: node scripts/build-native.mjs
      - name: Verify published entry bytes and read-only location discovery
        run: node --test scripts/lib/__tests__/legacy-desktop.test.mjs
