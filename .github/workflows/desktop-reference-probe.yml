name: Desktop Linux reference diagnosis
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-application']
    paths:
      - '.github/scripts/probe-linux-program-references.mjs'
      - '.github/workflows/desktop-reference-probe.yml'
permissions:
  contents: read
jobs:
  reference-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build same-source OS observation helper only
        run: node scripts/build-native.mjs
      - name: Observe an empty directory and bounded unknown identities
        run: node .github/scripts/probe-linux-program-references.mjs
