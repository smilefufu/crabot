name: Windows actual installer UI acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crabot-win32-x64-offline-test-da9de63af4fb790e50615958b38d291ca606e18d
          run-id: 41003325130
          github-token: ${{ github.token }}
          path: .desktop-build/wrapper-ui
      - name: Install with the actual EXE without Retry
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .desktop-build/wrapper-ui -Recurse -Filter '*desktop.6*offline-candidate.exe')
          if ($files.Count -ne 1) { throw 'Expected the exact Windows desktop.6 installer' }
          & .github/scripts/smoke-windows-wrapper-ui.ps1 -Installer $files[0].FullName | Tee-Object .desktop-build/windows-wrapper-ui.log
      - name: Keep actual installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wrapper-ui-acceptance
          path: .desktop-build/windows-wrapper-ui.log
          if-no-files-found: warn
