name: Desktop admission native regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare finite native test dependencies
        run: |
          mkdir -p .desktop-build
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          pnpm --dir crabot-client run build
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-desktop install --frozen-lockfile
          pnpm --dir crabot-desktop run build
      - name: Actual Node admission and integrity boundaries
        run: node --test --test-name-pattern='legacy online|legacy preparation and handoff|actual target Node takes over|target takeover|Mac App legacy admission' scripts/lib/__tests__/desktop-payload.test.mjs 2>&1 | tee .desktop-build/admission-regression.log
      - name: First-launch and old process shutdown
        run: node --test crabot-desktop/tests/mac-first-launch.test.mjs scripts/lib/__tests__/legacy-runtime.test.mjs scripts/lib/__tests__/legacy-stop.test.mjs 2>&1 | tee .desktop-build/first-launch-stop.log
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-${{ runner.os }}-${{ github.sha }}
          path: .desktop-build/*.log
          if-no-files-found: warn
