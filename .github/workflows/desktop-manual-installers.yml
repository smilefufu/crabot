name: Desktop manual test installers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Prepare only observation and driver dependencies
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          pnpm --dir crabot-client run build
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-desktop install --frozen-lockfile
          (cd crabot-desktop && node -e "require('electron')")
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41077069183
          name: crabot-win32-x64-offline-test-9adff42f9561394632a449b19209ab3111b2f23d
          path: .desktop-build/prior-candidate
      - name: Extract the unchanged sealed candidate
        run: node .github/scripts/replay-windows-installer.mjs .desktop-build/prior-candidate
      - name: Replay actual v14 takeover with target stderr
        run: node .github/scripts/verify-legacy-user-takeover.mjs .desktop-build/manual/paired .desktop-build/manual/installer v2026.10.14.1 2>&1 | tee .desktop-build/windows-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-takeover-replay-${{ github.sha }}
          path: |
            .desktop-build/*.log
            .desktop-build/*.json
          include-hidden-files: true
          retention-days: 7
