name: Validate exact Windows diagnostic line
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  line:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute exact copied command
        shell: ${{ matrix.shell }}
        run: ./.github/scripts/check-windows-diagnostic-line.ps1
