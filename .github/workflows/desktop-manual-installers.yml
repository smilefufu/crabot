name: Validate exact Windows diagnostic line
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell5:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./.github/scripts/check-windows-diagnostic-line.ps1
  powershell7:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./.github/scripts/check-windows-diagnostic-line.ps1
