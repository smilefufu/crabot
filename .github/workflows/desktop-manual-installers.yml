name: Windows extraction native probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - run: pnpm --dir crabot-desktop install --frozen-lockfile
      - run: node .github/scripts/probe-windows-direct-extraction.mjs
