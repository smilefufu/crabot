name: Windows extraction replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/download-artifact@v4
        with:
          name: crabot-win32-x64-offline-test-58f39f1f047600ea764e7508b20ebc9252efb557
          run-id: 40988215419
          github-token: ${{ github.token }}
          path: .desktop-build/archive
      - name: Prepare native verifier only
        run: |
          pnpm --dir crabot-client install --frozen-lockfile
          pnpm --dir crabot-client run build
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-desktop install --frozen-lockfile
          node scripts/build-native.mjs
      - name: Actual installed Windows legacy recognition and safe cancellation
        run: |
          node --test scripts/lib/__tests__/legacy-windows-launcher.test.mjs scripts/lib/__tests__/legacy-desktop.test.mjs scripts/lib/__tests__/legacy-entry-fence.test.mjs
          node --test crabot-desktop/tests/installer-discovery-dialogs.test.mjs
      - name: Replay full extraction with corrected private path
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .desktop-build/archive -Recurse -Filter '*offline-candidate.exe')
          if ($files.Count -ne 1) { throw 'Expected one existing complete candidate' }
          New-Item .desktop-build/replay/distribution -ItemType Directory -Force | Out-Null
          Copy-Item $files[0].FullName .desktop-build/replay/distribution/
          node .github/scripts/smoke-windows-wrapper.mjs .desktop-build/replay 2>&1 | Tee-Object .desktop-build/windows-wrapper-replay.log
          if ($LASTEXITCODE -ne 0) { throw 'Extraction verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wrapper-replay
          path: .desktop-build/windows-wrapper-replay.log
          if-no-files-found: warn
