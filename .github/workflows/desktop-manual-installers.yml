name: Desktop manual test installers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  removal-profile:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Prepare finite native observation dependencies
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          pnpm --dir crabot-client run build
          pnpm --dir scripts/lib install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41092605799
          name: crabot-win32-x64-offline-test-d1f4f49961a7efc8a86d7eab1028caabe84f2829
          path: .desktop-build/profile-candidate
      - name: Profile unchanged known-program deletion and preserve dummy data
        run: node .github/scripts/profile-windows-removal.mjs .desktop-build/profile-candidate 2>&1 | tee .desktop-build/windows-removal-profile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-removal-profile-${{ github.sha }}
          path: |
            .desktop-build/windows-removal-profile.json
            .desktop-build/windows-removal-profile.log
          include-hidden-files: true
          retention-days: 7
