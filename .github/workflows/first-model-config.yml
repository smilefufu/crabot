name: First model configuration
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-first-model-config']
  pull_request:
    paths:
      - 'crabot-admin/src/model-client-http.test.ts'
      - 'crabot-admin/src/types.ts'
      - 'crabot-agent/src/core/config-loader.ts'
      - 'crabot-agent/tests/core/config-loader*.test.ts'
      - '.github/workflows/first-model-config.yml'
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's SDK and business dependencies
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin run build
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          node scripts/build-native.mjs
      - name: Verify real HTTP references and coherent configuration without a model call
        working-directory: crabot-admin
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/model-client-http.test.ts src/core-agent-config-coherent-read.test.ts
          --maxWorkers=1 --minWorkers=1
      - name: Verify protected first startup and authenticated configuration reload
        working-directory: crabot-agent
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/core/config-loader.test.ts tests/core/config-loader-slice0.test.ts
          --maxWorkers=1 --minWorkers=1
