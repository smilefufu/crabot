name: Ubuntu DEB package hooks
on:
  pull_request:
    paths:
      - 'scripts/desktop/ubuntu-deb.mjs'
      - '.github/scripts/test-ubuntu-deb-package.mjs'
      - '.github/workflows/ubuntu-deb-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dh-apparmor debhelper apparmor-utils zstd
          pnpm --dir crabot-desktop install --frozen-lockfile
      - name: Actual dpkg hooks and configuration with tiny process fixtures
        run: node .github/scripts/test-ubuntu-deb-package.mjs
