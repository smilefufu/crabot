name: Release desktop.25 to desktop.26 upgrade acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            run: 42986079303
            artifact: offline-test
            pattern: '*offline-candidate.exe'
            baseline: Crabot-0.1.0-desktop.25-win-x64-offline-candidate.exe
          - target: darwin-arm64
            os: macos-15
            run: 42986083675
            artifact: offline-test
            pattern: '*candidate.dmg'
            baseline: Crabot-0.1.0-desktop.25-mac-arm64-candidate.dmg
          - target: darwin-x64
            os: macos-15-intel
            run: 42986088193
            artifact: offline-test
            pattern: '*candidate.dmg'
            baseline: Crabot-0.1.0-desktop.25-mac-x64-candidate.dmg
          - target: linux-x64
            os: ubuntu-24.04
            run: 42986092889
            artifact: deb-test
            pattern: '*candidate.deb'
            baseline: Crabot-0.1.0-desktop.25-linux-amd64-candidate.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
      BASELINE_NAME: ${{ matrix.baseline }}
      FINAL_PATTERN: ${{ matrix.pattern }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Require accepted final package build
        run: test "$(gh run view '${{ matrix.run }}' --repo smilefufu/crabot --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: crabot-${{ matrix.target }}-${{ matrix.artifact }}-74dec3c55d7b17196ea851ca994c2e12e805f151
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: .desktop-build/release-final
      - name: Download and verify exact published desktop.25 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os,re
          root=Path('.desktop-build/released-baseline/distribution');root.mkdir(parents=True)
          name=os.environ['BASELINE_NAME'];tag='v2026.11.10.1'
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo','smilefufu/crabot','--json','assets'],text=True))
          asset=next(item for item in release['assets'] if item['name']==name)
          subprocess.run(['gh','release','download',tag,'--repo','smilefufu/crabot','--pattern',name,'--pattern',name+'.sha256','--dir',str(root)],check=True)
          file=root/name
          with file.open('rb') as stream:sha=hashlib.file_digest(stream,'sha256').hexdigest()
          assert asset['digest']=='sha256:'+sha and file.stat().st_size==asset['size']
          assert (root/(name+'.sha256')).read_text(encoding='utf-8-sig').split()[0].lower()==sha
          if os.environ['TARGET']=='linux-x64':(root/'installers.json').write_text(json.dumps({'version':'0.1.0-desktop.25','files':[{'file':name,'sha256':sha}]}))
          final=list(Path('.desktop-build/release-final').rglob(os.environ['FINAL_PATTERN']));assert len(final)==1
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('BASELINE_PACKAGE='+str(file.resolve())+'\nFINAL_PACKAGE='+str(final[0].resolve())+'\n')
          print('VERIFIED_PUBLISHED_BASELINE',name,sha)
          PY
      - name: Windows actual Finish and Start menu upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .github/scripts/smoke-windows-wrapper-capacity.ps1 -Installer $env:BASELINE_PACKAGE -UpgradeInstaller $env:FINAL_PACKAGE -ExpectedVersion '0.1.0-desktop.26' -UpgradeLaunch finish -Expected complete | Tee-Object .desktop-build/release-windows-upgrade.log
      - name: Mac exact DMG fixed-path replacement and reopen
        if: runner.os == 'macOS'
        run: node .github/scripts/verify-release-mac-upgrade.mjs "$BASELINE_PACKAGE" "$FINAL_PACKAGE" 2>&1 | tee .desktop-build/release-mac-upgrade.log
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - name: Prepare original Ubuntu acceptance dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor-utils libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 xvfb xauth xdotool dbus-x11
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
      - name: Ubuntu real published DEB to new final DEB
        if: runner.os == 'Linux'
        run: |
          distribution=$(dirname "$FINAL_PACKAGE")
          dbus-run-session -- xvfb-run -a node .github/scripts/verify-ubuntu-deb.mjs "$distribution" --baseline=.desktop-build/released-baseline/distribution 2>&1 | tee .desktop-build/release-ubuntu-upgrade.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-upgrade-${{ matrix.target }}
          path: |
            .desktop-build/release-*-upgrade.log
            .desktop-build/release-final/**/acceptance*.json
            .desktop-build/release-final/**/acceptance*.log
            ${{ runner.temp }}/exact-desktop-upgrade/acceptance.json
            ${{ runner.temp }}/exact-desktop-upgrade/*.log
          if-no-files-found: warn
