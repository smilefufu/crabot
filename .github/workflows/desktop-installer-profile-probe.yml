name: Inspect isolated release proxy and CA environment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crabot-darwin-arm64-offline-test-45ac91532d4308c48ec936f4149d7d56ef437eec
          run-id: 42750399454
          github-token: ${{ github.token }}
          path: candidate
      - name: Compare inherited environment and explicitly disabled proxies with strict TLS
        shell: bash
        run: |
          dmg=$(find candidate -name '*candidate.dmg' -print -quit)
          mount="$RUNNER_TEMP/inspect-proxy-candidate"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          core="$mount/Crabot.app/Contents/Resources/core"
          runtime=$(node -p 'const fs=require("fs");fs.realpathSync(process.argv[1]+"/"+JSON.parse(fs.readFileSync(process.argv[1]+"/scrapling-runtime.json")).directory)' "$core")
          "$runtime/python/bin/python3.12" -I -B - "$runtime" <<'PY'
          import os,sys,json,subprocess,re,hashlib,pathlib
          root=pathlib.Path(sys.argv[1]);sys.path.insert(0,str(root/'packages'))
          import curl_cffi,curl_cffi.curl,certifi
          keys=['HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NO_PROXY','http_proxy','https_proxy','all_proxy','no_proxy','SSL_CERT_FILE','CURL_CA_BUNDLE','REQUESTS_CA_BUNDLE','SSL_CERT_DIR']
          print('ENV_PRESENCE '+json.dumps({key:bool(os.environ.get(key)) for key in keys}),flush=True)
          system=subprocess.check_output(['scutil','--proxy'],text=True)
          flags={key:int(value) for key,value in re.findall(r'(\w*Enable)\s*:\s*(\d+)',system)}
          print('SYSTEM_PROXY_FLAGS '+json.dumps(flags),flush=True)
          ca=pathlib.Path(curl_cffi.curl.DEFAULT_CACERT)
          print('DEFAULT_CA '+json.dumps({'path':str(ca),'sha256':hashlib.sha256(ca.read_bytes()).hexdigest()}),flush=True)
          for mode in ['inherited','proxy_disabled','proxy_disabled_current_ca']:
            if mode!='inherited':
              for key in keys[:8]:os.environ.pop(key,None)
            options={} if mode=='inherited' else {'trust_env':False,'curl_options':{curl_cffi.CurlOpt.PROXY:''}}
            for url in ['https://example.com','https://github.com']:
              try:
                with curl_cffi.requests.Session(**options) as session:
                  response=session.get(url,timeout=20,verify=certifi.where() if mode.endswith('current_ca') else True)
                  print('PROXY_CA_COMPARE '+json.dumps({'mode':mode,'url':url,'http_status':response.status_code,'passed':True}),flush=True)
              except Exception as error:print('PROXY_CA_COMPARE '+json.dumps({'mode':mode,'url':url,'passed':False,'error':str(error)}),flush=True)
          PY
