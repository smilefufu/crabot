name: Windows Node bootstrap regression
on:
  push:
    branches: [ci/windows-node-lock-20261014]
permissions:
  contents: read
jobs:
  installer-ps5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Windows installer regressions
        shell: powershell
        run: .github/scripts/test-installer-windows.ps1
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Repair real old Node and verify public final ZIP
        shell: powershell
        env:
          CRABOT_CI_SKIP_SOURCE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          . ./install.ps1
          Ensure-Node
          $privateNode = Join-Path $env:LOCALAPPDATA 'crabot/node/node.exe'
          $version = (& $privateNode -v).TrimStart('v')
          if ($LASTEXITCODE -ne 0 -or [version]$version -lt [version]'22.14.0') { throw 'Private Node bootstrap failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'crabot-v2026.10.14.1-windows-x64.zip'
          $url = 'https://github.com/smilefufu/crabot/releases/download/v2026.10.14.1/crabot-v2026.10.14.1-windows-x64.zip'
          Invoke-WebRequest $url -UseBasicParsing -OutFile $archive
          Invoke-WebRequest ($url + '.sha256') -UseBasicParsing -OutFile ($archive + '.sha256')
          $expected = (Get-Content -LiteralPath ($archive + '.sha256') -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $expected) { throw 'Public ZIP checksum mismatch' }
          & $privateNode .github/scripts/smoke-installer.mjs $archive powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Final ZIP installation or startup failed' }
  installer-ps7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Windows installer regressions
        shell: pwsh
        run: .github/scripts/test-installer-windows.ps1
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Repair real old Node and verify public final ZIP
        shell: pwsh
        env:
          CRABOT_CI_SKIP_SOURCE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          . ./install.ps1
          Ensure-Node
          $privateNode = Join-Path $env:LOCALAPPDATA 'crabot/node/node.exe'
          $version = (& $privateNode -v).TrimStart('v')
          if ($LASTEXITCODE -ne 0 -or [version]$version -lt [version]'22.14.0') { throw 'Private Node bootstrap failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'crabot-v2026.10.14.1-windows-x64.zip'
          $url = 'https://github.com/smilefufu/crabot/releases/download/v2026.10.14.1/crabot-v2026.10.14.1-windows-x64.zip'
          Invoke-WebRequest $url -UseBasicParsing -OutFile $archive
          Invoke-WebRequest ($url + '.sha256') -UseBasicParsing -OutFile ($archive + '.sha256')
          $expected = (Get-Content -LiteralPath ($archive + '.sha256') -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $expected) { throw 'Public ZIP checksum mismatch' }
          & $privateNode .github/scripts/smoke-installer.mjs $archive pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Final ZIP installation or startup failed' }
