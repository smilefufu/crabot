name: Desktop runtime

on:
  push:
    branches: ['feat/desktop-*']
  pull_request:
    paths:
      - 'crabot-desktop/**'
      - 'crabot-client/**'
      - 'crabot-shared/**'
      - 'crabot-admin/**'
      - 'src/cli/client*'
      - 'crabot-core/**'
      - 'crabot-native/**'
      - 'crabot-agent/src/core/runtime-env.ts'
      - 'crabot-agent/src/agent/mcp-connector.ts'
      - 'crabot-agent/src/workers/**'
      - 'crabot-agent/src/manager/bootstrap.ts'
      - 'crabot-agent/src/manager/tools/worker-tools.ts'
      - 'crabot-agent/tests/workers/**'
      - 'scripts/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/scripts/*product*'
      - '.github/scripts/fixtures/product-*'
      - '.github/scripts/desktop-runtime-scope.mjs'
      - '.github/scripts/smoke-migration-interruption.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Desktop foundation ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Select complete runtime validation scope
        id: scope
        env:
          CRABOT_CI_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: node .github/scripts/desktop-runtime-scope.mjs
      - name: Linux build prerequisites
        if: runner.os == 'Linux' && steps.scope.outputs.full_runtime == 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libexpat1-dev zlib1g-dev
      - name: Prepare isolated build directory
        run: mkdir -p .desktop-build
      - name: Build OS process identity helper with installed compiler
        run: node scripts/build-native.mjs
      - name: Shared system installation ownership and restrictive umask
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE "$(command -v node)" .github/scripts/smoke-system-install-ownership.mjs 2>&1 | tee .desktop-build/system-install-ownership.log
      - name: Install frozen build dependencies
        run: |
          pnpm --dir crabot-client install --frozen-lockfile
          node crabot-client/node_modules/typescript/bin/tsc -p crabot-client/tsconfig.json
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-shared install --frozen-lockfile
          node crabot-shared/node_modules/typescript/bin/tsc -p crabot-shared/tsconfig.json
          for module in crabot-core crabot-agent crabot-admin crabot-mcp-tools crabot-channel-telegram crabot-channel-wechat crabot-channel-feishu crabot-channel-dingtalk crabot-channel-voice; do
            pnpm --dir "$module" install --frozen-lockfile
            node "$module/node_modules/typescript/bin/tsc" -p "$module/tsconfig.json"
          done
          pnpm --dir crabot-desktop install --frozen-lockfile
      - name: Linux workspace bind-mount boundary in a private mount namespace
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: sudo --preserve-env=GITHUB_ACTIONS unshare --mount --propagation private -- "$(command -v node)" --import ./crabot-shared/node_modules/tsx/dist/loader.mjs --test --test-name-pattern='Linux same-device bind mounts' crabot-shared/src/workspace-usage.test.ts
      - name: Runtime regressions
        timeout-minutes: 15
        run: |
          node --test crabot-client/tests/*.test.mjs
          node --import ./crabot-shared/node_modules/tsx/dist/loader.mjs --test crabot-shared/src/workspace-catalog.test.ts crabot-shared/src/workspace-usage.test.ts crabot-shared/src/workspace-mounts.test.ts crabot-shared/src/workspace-relocation-files.test.ts
          node --test scripts/lib/__tests__/product-*.test.mjs scripts/lib/__tests__/agent-python-selection.test.mjs
          node --test scripts/lib/__tests__/cli-password-input.test.mjs scripts/lib/__tests__/instance-runtime.test.mjs scripts/lib/__tests__/cli-lock-native.test.mjs scripts/lib/__tests__/process-identity.test.mjs scripts/lib/__tests__/local-auth-transport.test.mjs scripts/lib/__tests__/stop-windows.test.mjs scripts/lib/__tests__/background-core.test.mjs scripts/lib/__tests__/supervisor-bootstrap.test.mjs scripts/lib/__tests__/mm-startup.test.mjs
          node --test scripts/lib/__tests__/system-*.test.mjs
          node --test scripts/lib/__tests__/desktop-session.test.mjs
          node --test scripts/lib/__tests__/core-preparation.test.mjs scripts/lib/__tests__/core-preflight.test.mjs scripts/lib/__tests__/installer-compat.test.mjs
          node --test scripts/lib/__tests__/desktop-asar.test.mjs scripts/lib/__tests__/archive-core.test.mjs scripts/lib/__tests__/core-release.test.mjs scripts/lib/__tests__/cli-launcher.test.mjs scripts/lib/__tests__/cli-installation.test.mjs
          node --test scripts/lib/__tests__/legacy-desktop.test.mjs scripts/lib/__tests__/legacy-entry-fence.test.mjs scripts/lib/__tests__/legacy-system-*.test.mjs
          node --test scripts/lib/__tests__/legacy-mm-rpc.test.mjs
          node --test scripts/lib/__tests__/legacy-runtime.test.mjs scripts/lib/__tests__/legacy-stop.test.mjs
          node --test scripts/lib/__tests__/maintenance-backup.test.mjs
          node --test scripts/lib/__tests__/version-maintenance.test.mjs scripts/lib/__tests__/legacy-python-maintenance.test.mjs scripts/lib/__tests__/legacy-version-maintenance.test.mjs scripts/lib/__tests__/desktop-update-entry.test.mjs scripts/lib/__tests__/desktop-cli-install.test.mjs
          (cd scripts/upgrade-lib && node ../../node_modules/vitest/vitest.mjs run __tests__/release.test.mjs __tests__/extract.test.mjs __tests__/runner.test.mjs --maxWorkers=1 --minWorkers=1)
          cd crabot-core
          node node_modules/vitest/vitest.mjs run src/agent-venv.test.ts src/core-modules.test.ts src/shutdown-generation.test.ts src/module-management-secrets.test.ts --maxWorkers=1 --minWorkers=1
      - name: Agent environment regressions
        run: |
          cd crabot-agent
          node node_modules/vitest/vitest.mjs run tests/core/config-loader.test.ts tests/core/config-loader-slice0.test.ts tests/core/runtime-env.test.ts tests/core/child-env-guard.test.ts tests/utils/resolve-bash-path.test.ts tests/agent/mcp-connector.test.ts tests/mcp-connector-tool-defaults.test.ts tests/manager/tool-face.test.ts tests/workers/harness/project-workspaces.test.ts tests/workers/harness/workspace-execution.test.ts tests/manager/read-model.test.ts tests/workers/harness/workspace-manager.test.ts tests/workers/harness/ledger-store.test.ts tests/workers/private-project-provision.test.ts tests/workers/private-project-runtime.test.ts tests/workers/codex-project-config.test.ts --maxWorkers=1 --minWorkers=1
      - name: Shared HTTP and chat protocol regressions
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.cli.json
          node node_modules/vitest/vitest.mjs run src/cli/client.test.ts --maxWorkers=1 --minWorkers=1
          cd crabot-admin
          node node_modules/vitest/vitest.mjs run src/workspaces.test.ts src/workspaces-http.test.ts src/chat-http-ws.test.ts src/chat-manager.test.ts src/chat-outbox-recovery.test.ts src/http-diagnostics.test.ts src/model-client-http.test.ts src/desktop-upgrade-http.test.ts src/version/upgrade-runner.test.ts src/version/version-service.test.ts src/desktop-auth.test.ts src/credentials.test.ts src/computer-use-setup-api.test.ts src/memory-access.test.ts src/voice-admin.test.ts src/managed-mcp.test.ts src/managed-mcp-runtime.test.ts src/mcp-subagent-config-mutation.test.ts src/core-agent-config-coherent-read.test.ts --maxWorkers=1 --minWorkers=1
      - name: Web compilation and state regressions
        run: |
          cd crabot-admin/web
          pnpm install --frozen-lockfile
          node node_modules/typescript/bin/tsc -p tsconfig.json
          node node_modules/vite/bin/vite.js build
          node node_modules/vitest/vitest.mjs run src/pages/Workspaces.test.tsx src/pages/Traces/WorkersView.test.tsx src/pages/Chat/index.test.tsx src/pages/MCPServers/MCPServerList.test.tsx src/pages/DesktopWelcome.test.tsx src/services/server-state.test.ts src/services/desktop-host.test.ts src/components/ChangePasswordDialog.test.tsx src/components/DesktopDiagnosticsPanel.test.tsx src/pages/Settings/ComputerUseSetupCard.test.tsx src/pages/Settings/VersionUpgradeCard.test.tsx src/pages/Settings/DesktopVersionUpgradeCard.test.tsx --maxWorkers=1 --minWorkers=1
      - name: Electron compilation and main-process state regressions
        working-directory: crabot-desktop
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.json
          node build-preload.mjs
          node --test tests/workspace-folder.test.mjs tests/desktop-disk.test.mjs tests/desktop-resources.test.mjs tests/first-model-fixture.test.mjs tests/full-host-control.test.mjs tests/desktop-network.test.mjs tests/artifact-network.test.mjs tests/session-host.test.mjs tests/diagnostics.test.mjs tests/login-startup.test.mjs tests/controller.test.mjs tests/update-dialog.test.mjs tests/update-package.test.mjs
      - name: Interrupted migration retains data and refuses automatic replay
        run: node .github/scripts/smoke-migration-interruption.mjs 2>&1 | tee .desktop-build/migration-interruption.log
      - name: Real sandboxed Electron window boundaries on Linux
        if: runner.os == 'Linux'
        working-directory: crabot-desktop
        run: xvfb-run -a node --test tests/electron-boundary.test.mjs 2>&1 | tee ../.desktop-build/electron-boundary.log
      - name: Real sandboxed Electron window boundaries on macOS and Windows
        if: runner.os != 'Linux'
        working-directory: crabot-desktop
        run: node --test tests/electron-boundary.test.mjs 2>&1 | tee ../.desktop-build/electron-boundary.log
      - name: Build locked browser and computer-use resources
        if: steps.scope.outputs.full_runtime == 'true'
        run: |
          node scripts/prepare-scrapling.mjs --release=desktop-ci
          node scripts/prepare-computer-use.mjs
      - name: Build sealed product environment
        if: steps.scope.outputs.full_runtime == 'true'
        run: node scripts/prepare-product-runtime.mjs 2>&1 | tee .desktop-build/product-build.log
      - name: Observe legacy Python without executing old code
        if: steps.scope.outputs.full_runtime == 'true'
        run: node --test scripts/lib/__tests__/legacy-python.test.mjs 2>&1 | tee .desktop-build/legacy-python-inspection.log
      - name: Rebuild legacy Python in an unselected environment
        timeout-minutes: 20
        if: steps.scope.outputs.full_runtime == 'true'
        run: node --test scripts/lib/__tests__/legacy-python-rebuild.test.mjs 2>&1 | tee .desktop-build/legacy-python-rebuild.log
      - name: Execute real offline local capabilities
        if: steps.scope.outputs.full_runtime == 'true'
        run: node .github/scripts/smoke-product-runtime.mjs 2>&1 | tee .desktop-build/product-smoke.log
      - name: Real isolated managed MCP dependencies and stdio connections
        if: steps.scope.outputs.full_runtime == 'true'
        run: node .github/scripts/smoke-managed-mcp.mjs 2>&1 | tee .desktop-build/managed-mcp-smoke.log
      - name: Standard Ubuntu runtime compatibility
        if: runner.os == 'Linux' && steps.scope.outputs.full_runtime == 'true'
        run: |
          for release in 24.04 26.04; do
            docker run --rm --network=none \
              -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
              "ubuntu:$release" \
              /workspace/.product-runtime/node/bin/node \
              .github/scripts/smoke-product-runtime.mjs \
              > ".desktop-build/ubuntu-$release.log" 2>&1
          done
      - name: Assemble common core and unpacked Electron candidate
        if: steps.scope.outputs.full_runtime == 'true'
        run: |
          node scripts/desktop/stage-core.mjs "--out=.desktop-build/安装 候选/core" --version=0.1.0-desktop.1
          node .github/scripts/verify-release-payload.mjs "$GITHUB_WORKSPACE/.desktop-build/安装 候选/core"
          node .github/scripts/validate-staged-core.mjs ".desktop-build/安装 候选/core"
          node .github/scripts/smoke-installed-cli.mjs ".desktop-build/安装 候选/core"
          node scripts/desktop/package-application.mjs --candidate=true "--core=.desktop-build/安装 候选/core" "--out=.desktop-build/安装 候选/gui" 2>&1 | tee .desktop-build/gui-package.log
      - name: Real bundled Python selection inside scoped maintenance
        if: steps.scope.outputs.full_runtime == 'true'
        timeout-minutes: 8
        run: node .github/scripts/smoke-legacy-python-maintenance.mjs ".desktop-build/安装 候选/core" 2>&1 | tee .desktop-build/python-maintenance.log
      - name: Build and extract native installer candidates
        if: steps.scope.outputs.full_runtime == 'true'
        timeout-minutes: 15
        run: |
          node scripts/desktop/package-installers.mjs --candidate=true "--project=.desktop-build/安装 候选/gui" --out=.desktop-build/platform-installers 2>&1 | tee .desktop-build/installers.log
          node .github/scripts/verify-installer-candidates.mjs .desktop-build/platform-installers 2>&1 | tee .desktop-build/installer-verification.log
      - name: Boot actual packaged app with native session and CLI on Linux
        timeout-minutes: 10
        if: runner.os == 'Linux' && steps.scope.outputs.full_runtime == 'true'
        run: xvfb-run -a node .github/scripts/smoke-packaged-desktop.mjs ".desktop-build/安装 候选/gui" 2>&1 | tee .desktop-build/packaged-boot.log
      - name: Boot actual packaged app with native session and CLI on macOS and Windows
        timeout-minutes: 10
        if: runner.os != 'Linux' && steps.scope.outputs.full_runtime == 'true'
        run: node .github/scripts/smoke-packaged-desktop.mjs ".desktop-build/安装 候选/gui" 2>&1 | tee .desktop-build/packaged-boot.log
      - name: Ordinary CLI archive and actual upgrade command
        if: steps.scope.outputs.full_runtime == 'true'
        run: |
          node scripts/desktop/archive-core.mjs --candidate=true "--core=.desktop-build/安装 候选/core" --out=.desktop-build/cli-archive 2>&1 | tee .desktop-build/cli-archive.log
          node .github/scripts/smoke-cli-update.mjs ".desktop-build/安装 候选/core" ".desktop-build/安装 候选/core" .desktop-build/cli-archive/archive.json --cli-command 2>&1 | tee .desktop-build/cli-update.log
      - name: Real systemd administrator and three-user batch control
        if: runner.os == 'Linux' && steps.scope.outputs.full_runtime == 'true'
        timeout-minutes: 15
        run: sudo --preserve-env=GITHUB_ACTIONS "$GITHUB_WORKSPACE/.product-runtime/node/bin/node" .github/scripts/smoke-system-mode.mjs "$GITHUB_WORKSPACE/.desktop-build/安装 候选/core" "$GITHUB_WORKSPACE/.desktop-build/system-mode.json" "$GITHUB_WORKSPACE/.desktop-build/cli-archive/archive.json" 2>&1 | tee .desktop-build/system-mode.log
      - name: Whole Electron host with real core and CLI on Linux
        timeout-minutes: 12
        if: runner.os == 'Linux' && steps.scope.outputs.full_runtime == 'true'
        working-directory: crabot-desktop
        env:
          CRABOT_FULL_CORE_TEST: '1'
        run: xvfb-run -a node --test tests/full-host.test.mjs 2>&1 | tee ../.desktop-build/full-host.log
      - name: Whole Electron host with real core and CLI on macOS and Windows
        timeout-minutes: 12
        if: runner.os != 'Linux' && steps.scope.outputs.full_runtime == 'true'
        working-directory: crabot-desktop
        env:
          CRABOT_FULL_CORE_TEST: '1'
        run: node --test tests/full-host.test.mjs 2>&1 | tee ../.desktop-build/full-host.log
      - name: Save runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-${{ matrix.target }}
          path: |
            .desktop-build/*.log
            .desktop-build/*.png
            .desktop-build/runtime-scope.json
            .desktop-build/desktop-resources.json
            .desktop-build/desktop-initialization-disk.json
            .desktop-build/cli-update-disk.json
            .desktop-build/system-mode.json
            .desktop-build/platform-installers/installers.json
            .desktop-build/cli-archive/archive.json
            product-runtime.json
          if-no-files-found: warn
          include-hidden-files: true
