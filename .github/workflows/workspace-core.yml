name: Windows business tail probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Compile identical frozen SDK, Native and module sources
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          node crabot-client/node_modules/typescript/bin/tsc -p crabot-client/tsconfig.json
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-shared install --frozen-lockfile
          node crabot-shared/node_modules/typescript/bin/tsc -p crabot-shared/tsconfig.json
          for module in crabot-core crabot-agent crabot-admin; do
            pnpm --dir "$module" install --frozen-lockfile
            node "$module/node_modules/typescript/bin/tsc" -p "$module/tsconfig.json"
          done
      - name: Prepare the existing real Memory fixture
        run: uv sync --project crabot-memory --frozen --python 3.13
      - name: Run the two unchanged real Agent and Memory tail cases
        working-directory: crabot-core
        env:
          CRABOT_WORKSPACE_BUSINESS_ONSTART_CI: '1'
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='isolated business Agent after workspace relocation' --maxWorkers=1 --minWorkers=1
