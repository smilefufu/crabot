name: Workspace Core lifecycle

on:
  push:
    branches: ['feat/desktop-*']
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'crabot-admin/src/workspace-recovery-auth.ts'
      - 'crabot-admin/src/workspace-finalization-web.ts'
      - 'crabot-admin/src/workspace-finalization-web.test.ts'
      - 'crabot-core/src/index.ts'
      - 'crabot-core/src/process-tree.ts'
      - 'crabot-core/src/process-tree*.test.ts'
      - 'crabot-core/src/module-manager-lifecycle.test.ts'
      - 'crabot-core/src/module-runtime-registry.ts'
      - 'crabot-core/src/module-runtime-registry.test.ts'
      - 'crabot-core/src/test-fixtures/uv-python-sleeper.py'
      - 'crabot-core/src/test-fixtures/workspace-config-admin.cjs'
      - 'crabot-agent/src/core/workspace-relocation-*.ts'
      - 'crabot-agent/tests/core/workspace-relocation-*.test.ts'
      - 'crabot-agent/src/unified-agent.ts'
      - 'crabot-shared/src/workspace-types.ts'
      - 'crabot-shared/src/module-base.ts'
      - 'crabot-shared/src/workspace-maintenance.ts'
      - 'crabot-core/src/workspace-*.test.ts'
      - 'crabot-agent/tests/core/fixtures/**'
      - 'scripts/lib/workspace-*'
      - 'scripts/lib/process-identity.cjs'
      - 'scripts/lib/owned-process-tree.cjs'
      - 'scripts/lib/module-carrier-rpc.cjs'
      - 'scripts/lib/module-runtime-rpc.cjs'
      - 'scripts/lib/pinned-process-rpc.cjs'
      - 'scripts/lib/__tests__/module-shutdown-rpc.test.mjs'
      - 'scripts/lib/__tests__/module-carrier-rpc.test.mjs'
      - 'crabot-native/**'
      - 'scripts/workspace-root-probe.mjs'
      - 'scripts/workspace-recovery-coordinator.mjs'
      - 'scripts/workspace-runtime-gate.mjs'
      - 'scripts/lib/__tests__/workspace-root-probe.test.mjs'
      - '.github/workflows/workspace-core.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core:
    name: ${{ matrix.suite == 'business' && 'Business workspace runtime' || matrix.suite == 'archive' && 'Archived workspace records' || matrix.suite == 'recovery-terminal' && 'Cold workspace release' || matrix.suite == 'recovery-services' && 'Cold workspace service restoration' || matrix.suite == 'recovery-admin' && 'Cold workspace Admin restoration' || matrix.suite == 'recovery' && 'Cold workspace recovery' || matrix.suite == 'owned' && 'Owned workspace migrations' || matrix.suite == 'owned-recovery' && 'Same MM workspace recovery' || matrix.suite == 'completion' && 'Workspace job completion' || 'Fixed workspace lifecycle' }} ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
        suite: [finite, business, archive, recovery, recovery-terminal, recovery-services, recovery-admin, owned, owned-recovery, completion]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: workspace-core-${{ github.ref }}-${{ matrix.os }}-${{ matrix.suite }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Compile identity and frozen finite module dependencies
        id: compile
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          node crabot-client/node_modules/typescript/bin/tsc -p crabot-client/tsconfig.json
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-shared install --frozen-lockfile
          node crabot-shared/node_modules/typescript/bin/tsc -p crabot-shared/tsconfig.json
          for module in crabot-core crabot-agent crabot-admin; do
            pnpm --dir "$module" install --frozen-lockfile
            node "$module/node_modules/typescript/bin/tsc" -p "$module/tsconfig.json"
          done
      - name: Actual fixed directory probe and bounded cleanup
        if: matrix.suite == 'finite'
        run: node --test scripts/lib/__tests__/workspace-root-probe.test.mjs scripts/lib/__tests__/module-carrier-rpc.test.mjs scripts/lib/__tests__/module-shutdown-rpc.test.mjs
      - name: Persistent workspace maintenance guards
        if: matrix.suite == 'finite'
        working-directory: crabot-shared
        run: node --import tsx --test src/workspace-maintenance.test.ts src/workspace-job-query.test.ts src/workspace-recovery-start-request.test.ts src/module-base.test.ts
      - name: Admin prepared job ownership
        if: matrix.suite == 'finite'
        working-directory: crabot-admin
        run: node node_modules/vitest/vitest.mjs run src/workspace-finalization-web.test.ts src/workspace-recovery-finalization-web.test.ts src/workspaces-http.test.ts --maxWorkers=1 --minWorkers=1
      - name: Original lifecycle and maintenance regressions
        if: matrix.suite == 'finite'
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/process-tree.test.ts src/process-tree-exit-race.test.ts src/module-manager-lifecycle.test.ts src/module-runtime-registry.test.ts src/module-manager-health.test.ts src/module-manager-advanced.test.ts src/workspace-maintenance.test.ts src/workspace-recovered-job-retirement.test.ts src/workspace-recovery-runtime.test.ts src/workspace-module-restoration.test.ts src/workspace-runtime-gate.test.ts src/workspace-module-scope.test.ts --maxWorkers=1 --minWorkers=1
      - name: Actual fixed job launch and technical health without business onStart
        if: ${{ matrix.suite == 'finite' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='^(?!.*completes two actually owned).*(?:finite cold terminal diagnostics|MM reads workspace job status|MM reads workspace recovery handoff|MM owns the initial|MM verifies an initial|actual Admin recovery RPC observer|post-relocation validation launches|new runtime health and Root)' --maxWorkers=1 --minWorkers=1
      - name: Actual two owned SDK migrations and return to the default root
        if: ${{ matrix.suite == 'owned' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='completes two actually owned initial jobs' --maxWorkers=1 --minWorkers=1
      - name: Same MM failed normal job, current recovery and another SDK migration
        if: ${{ matrix.suite == 'owned-recovery' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='same MM workspace recovery and later migration' --maxWorkers=1 --minWorkers=1
      - name: Actual archived workspace records and bounded terminal failures
        if: ${{ matrix.suite == 'archive' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='fixed job archive storage handoff' --maxWorkers=1 --minWorkers=1
      - name: Current human admission, cold cleanup and fixed Node startup gate
        if: ${{ matrix.suite == 'recovery' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: |
          node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='^(?!.*starts only the planned cold validation generations: (?:completion release|lost release acknowledgement|release unavailable|release readonly root|released current observation|resume running module|resume inactive module|resume tool|resume actual Admin startup)$).*normal fixed-job Admin completion preparation' --maxWorkers=1 --minWorkers=1 --bail=1
      - name: Current cold completion, original services and Admin reopening
        if: ${{ matrix.suite == 'recovery-terminal' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        env:
          CRABOT_WORKSPACE_BUSINESS_ONSTART_CI: '1'
        run: |
          node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='starts only the planned cold validation generations: (?:completion release|lost release acknowledgement|release unavailable|release readonly root|released current observation)$' --maxWorkers=1 --minWorkers=1 --bail=1
      - name: Current cold service restoration and coordinator exit
        if: ${{ matrix.suite == 'recovery-services' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: |
          node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='starts only the planned cold validation generations: (?:resume running module|resume inactive module|resume tool)$' --maxWorkers=1 --minWorkers=1 --bail=1
      - name: Current cold actual Admin main and authenticated Web restoration
        if: ${{ matrix.suite == 'recovery-admin' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        env:
          CRABOT_WORKSPACE_BUSINESS_ONSTART_CI: '1'
        run: |
          node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='starts only the planned cold validation generations: resume actual Admin startup$' --maxWorkers=1 --minWorkers=1 --bail=1
      - name: Actual terminal release, business reopening and repeated jobs
        if: ${{ matrix.suite == 'completion' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='fixed terminal release and current Admin resume' --maxWorkers=1 --minWorkers=1
      - name: Prepare the actual Memory Python environment only in isolated CI
        if: ${{ matrix.suite == 'business' && !cancelled() && steps.compile.outcome == 'success' }}
        run: uv sync --project crabot-memory --frozen --python 3.13
      - name: Actual Agent main and business onStart at the selected workspace Root
        if: ${{ matrix.suite == 'business' && !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: crabot-core
        env:
          CRABOT_WORKSPACE_BUSINESS_ONSTART_CI: '1'
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='isolated business Agent after workspace relocation' --maxWorkers=1 --minWorkers=1
