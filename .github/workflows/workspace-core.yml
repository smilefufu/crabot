name: Workspace Core lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    name: Intel cold release measurement only
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Compile the unchanged actual Native SDK Shared Core Agent and Admin
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          node crabot-client/node_modules/typescript/bin/tsc -p crabot-client/tsconfig.json
          pnpm install --frozen-lockfile
          pnpm --dir scripts/lib install --frozen-lockfile
          pnpm --dir crabot-shared install --frozen-lockfile
          node crabot-shared/node_modules/typescript/bin/tsc -p crabot-shared/tsconfig.json
          for module in crabot-core crabot-agent crabot-admin; do
            pnpm --dir "$module" install --frozen-lockfile
            node "$module/node_modules/typescript/bin/tsc" -p "$module/tsconfig.json"
          done
      - name: Measure the existing cold completion release without changing product budgets or assertions
        working-directory: crabot-core
        env:
          CRABOT_WORKSPACE_BUSINESS_ONSTART_CI: '1'
        run: node node_modules/vitest/vitest.mjs run src/workspace-human-verification.test.ts --testNamePattern='starts only the planned cold validation generations: completion release$' --maxWorkers=1 --minWorkers=1 --bail=1
