name: Native foundation

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Protect the Windows test checkout before source builds
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $owner = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl.SetOwner($owner)
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @($owner.Value, 'S-1-5-18', 'S-1-5-32-544')) {
            $identity = New-Object System.Security.Principal.SecurityIdentifier($sid)
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $env:GITHUB_WORKSPACE -AclObject $acl
      - name: Compile this complete native boundary
        shell: bash
        run: node scripts/build-native.mjs
      - name: Build the Shared producer used by the workspace metadata host
        shell: bash
        run: |
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
      - name: Run native behavior and baseline downloader regressions
        shell: bash
        run: >-
          node --test
          scripts/lib/__tests__/process-identity.test.mjs
          scripts/lib/__tests__/source-native.test.mjs
          scripts/lib/__tests__/known-process-exit.test.mjs
          scripts/lib/__tests__/known-process-termination.test.mjs
          scripts/lib/__tests__/product-runtime.test.mjs
          scripts/lib/__tests__/cli-launcher.test.mjs
          scripts/lib/__tests__/private-file-paths.test.mjs
          scripts/lib/__tests__/program-references.test.mjs
          scripts/lib/__tests__/directory-move.test.mjs
          scripts/lib/__tests__/file-move.test.mjs
          scripts/lib/__tests__/directory-pin.test.mjs
          scripts/lib/__tests__/workspace-windows-metadata.test.mjs
          scripts/lib/__tests__/install-network.test.mjs
      - name: Verify ordinary Windows owner defaults outside the Bash token context
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern='Windows ordinary existing paths' scripts/lib/__tests__/private-file-paths.test.mjs
      - name: Verify source upgrade target preparation and native rollback
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec vitest run --root scripts/upgrade-lib __tests__/source-build-order.test.mjs __tests__/prepared-upgrade.test.mjs --pool=forks --poolOptions.forks.singleFork
