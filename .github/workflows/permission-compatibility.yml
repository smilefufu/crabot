name: Directory permission upgrade compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build actual native, SDK, Shared and Admin migration dependencies
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-admin run build
      - name: Verify actual scoped migration with both canonical and aliased program paths
        working-directory: crabot-admin
        run: node node_modules/vitest/vitest.mjs run src/legacy-directory-migration.test.ts --maxWorkers=1 --minWorkers=1
      - name: Confirm real credentials keep the copied DLL mapped only until their writer exits
        run: node .github/scripts/credentials-lock-probe.mjs
      - name: Install actual Core test dependencies
        run: pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
      - name: Identify the actual Windows descendants before the existing stop assertion
        working-directory: crabot-core
        run: node node_modules/vitest/vitest.mjs run src/workspace-module-stop.test.ts --maxWorkers=1 --minWorkers=1
