name: Workspace Agent business integration
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-workspace-agent-integration']
  pull_request:
    paths:
      - 'crabot-agent/src/unified-agent.ts'
      - 'crabot-agent/src/manager/bootstrap.ts'
      - 'crabot-agent/src/manager/registry.ts'
      - 'crabot-agent/src/manager/conversation-request-runner.ts'
      - '.github/workflows/workspace-agent-integration.yml'
permissions:
  contents: read
jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's actual Agent and dependencies
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir scripts/lib install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          node scripts/build-native.mjs
      - name: Verify actual sensitive HTTP, original authority and all execution admissions
        working-directory: crabot-agent
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/core/workspace-relocation-stop-rpc.test.ts
          tests/core/workspace-relocation-process-rpc.test.ts
          tests/core/workspace-recovery-routing.test.ts
          tests/manager/conversation-request-runner.test.ts
          tests/core/workspace-maintenance.test.ts
          tests/core/workspace-background-admissions.test.ts
          tests/core/workspace-background-processes.test.ts
          tests/manager/bootstrap.test.ts
          tests/engine/bg-entities/bg-agent.test.ts
          tests/core/child-env-guard.test.ts
          tests/permissions/managed-workspace-host.test.ts
          tests/unified-agent-trigger-schedule.test.ts
          tests/workers/harness/request-guard.test.ts
          --maxWorkers=1 --minWorkers=1
