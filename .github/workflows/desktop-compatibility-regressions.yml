name: Desktop finite compatibility regressions
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-compatibility-regressions']
  pull_request:
    paths:
      - 'scripts/lib/__tests__/**'
      - 'scripts/upgrade-lib/__tests__/**'
      - '.github/workflows/desktop-compatibility-regressions.yml'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's actual SDK, Shared, Native and internal host
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:cli
          pnpm --dir scripts/lib install --frozen-lockfile --ignore-scripts
          node scripts/build-native.mjs
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          pnpm --dir crabot-desktop install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-desktop run build
      - name: Install original publisher fixture dependency
        run: pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
      - name: Build actual Admin startup dependency
        run: pnpm --dir crabot-admin run build
      - name: Verify finite installation, old-data and workspace regressions
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/archive-core.test.mjs
          scripts/lib/__tests__/core-preparation.test.mjs
          scripts/lib/__tests__/desktop-asar.test.mjs
          scripts/lib/__tests__/desktop-installation.test.mjs
          scripts/lib/__tests__/instance-runtime.test.mjs
          scripts/lib/__tests__/legacy-desktop-cli.test.mjs
          scripts/lib/__tests__/legacy-desktop.test.mjs
          scripts/lib/__tests__/workspace-data-compat.test.mjs
          scripts/lib/__tests__/workspace-default-target.test.mjs
          scripts/lib/__tests__/workspace-file-plan.test.mjs
          scripts/lib/__tests__/workspace-job-status.test.mjs
          scripts/lib/__tests__/workspace-owner-inheritance.test.mjs
          scripts/lib/__tests__/workspace-process-stop.test.mjs
          scripts/lib/__tests__/workspace-target-access.test.mjs
          scripts/lib/__tests__/workspace-windows-metadata.test.mjs
      - name: Verify existing check command without a live instance
        working-directory: scripts/lib
        run: node node_modules/vitest/vitest.mjs run __tests__/check.test.mjs --maxWorkers=1 --minWorkers=1
      - name: Verify scoped upgrade compatibility without starting MM
        working-directory: scripts/upgrade-lib
        run: >-
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mjs
          __tests__/extract.test.mjs
          __tests__/release.test.mjs
          __tests__/scoped-migration.test.mjs
          __tests__/scoped-preparation.test.mjs
          __tests__/shared-requests.test.mjs
          --maxWorkers=1 --minWorkers=1
