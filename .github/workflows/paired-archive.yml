name: Paired archive extraction

on:
  push:
    branches: ['feat/desktop-*']
    paths:
      - 'scripts/desktop/extract-paired-release.py'
      - 'scripts/desktop/archive-paired-release.py'
      - 'scripts/desktop/__tests__/extract-paired-release.test.py'
      - '.github/workflows/paired-archive.yml'
  pull_request:
    paths:
      - 'scripts/desktop/extract-paired-release.py'
      - 'scripts/desktop/archive-paired-release.py'
      - 'scripts/desktop/__tests__/extract-paired-release.test.py'
      - '.github/workflows/paired-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-archive-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  paired-extraction:
    name: Paired archive Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Check pinned Python archive identity before the full product build
        run: uv run --no-project --no-config --managed-python --python 3.12.12 python -I -B scripts/desktop/__tests__/extract-paired-release.test.py
