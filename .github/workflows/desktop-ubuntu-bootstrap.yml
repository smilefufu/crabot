name: Desktop Ubuntu native bootstrap

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-*']
    paths:
      - 'crabot-desktop/native/ubuntu/**'
      - 'crabot-desktop/tests/native/**'
      - 'crabot-desktop/src/ubuntu-removal-progress.ts'
      - 'crabot-desktop/src/ubuntu-removal-rules.ts'
      - 'crabot-desktop/src/ubuntu-removal-host.ts'
      - 'crabot-desktop/src/ubuntu-installer-backend.ts'
      - 'crabot-desktop/src/ubuntu-installer-removal.ts'
      - 'crabot-desktop/tests/ubuntu-installer-removal.test.mjs'
      - 'crabot-desktop/tests/fixtures/ubuntu-installer-removal-actor.mjs'
      - 'scripts/lib/desktop-removal-installer.mjs'
      - 'crabot-desktop/src/removal-source.ts'
      - 'crabot-desktop/tests/removal-frame.test.mjs'
      - 'crabot-desktop/tests/fixtures/removal-frame-actor.cjs'
      - 'crabot-desktop/src/removal-operation.ts'
      - 'crabot-desktop/src/removal-request.ts'
      - 'crabot-desktop/src/installation-removal.ts'
      - 'scripts/desktop/ubuntu-maintenance-main.mjs'
      - 'crabot-desktop/src/ubuntu-process.ts'
      - 'crabot-desktop/src/operation-progress.ts'
      - 'crabot-desktop/tests/ubuntu-removal-progress.test.mjs'
      - 'crabot-desktop/tests/ubuntu-removal-host.test.mjs'
      - 'scripts/lib/desktop-removal-host.mjs'
      - 'scripts/lib/desktop-removal-frame.mjs'
      - 'scripts/lib/desktop-removal-job.mjs'
      - 'scripts/lib/desktop-removal-source.mjs'
      - 'crabot-desktop/tests/fixtures/ubuntu-removal-node-parent.cjs'
      - 'crabot-desktop/tests/fixtures/removal-progress-peer.c'
      - 'crabot-native/**'
      - 'scripts/build-native.mjs'
      - 'scripts/desktop/build-ubuntu-installer.mjs'
      - 'scripts/desktop/package-ubuntu-installer.mjs'
      - 'scripts/desktop/ubuntu-bootstrap.test.mjs'
      - 'scripts/desktop/ubuntu-maintenance-backend*'
      - 'scripts/lib/desktop-maintenance-bootstrap.mjs'
      - '.github/workflows/desktop-ubuntu-bootstrap.yml'
  pull_request:
    paths:
      - 'crabot-desktop/native/ubuntu/**'
      - 'crabot-desktop/tests/native/**'
      - 'crabot-desktop/src/ubuntu-removal-progress.ts'
      - 'crabot-desktop/src/ubuntu-removal-rules.ts'
      - 'crabot-desktop/src/ubuntu-removal-host.ts'
      - 'crabot-desktop/src/ubuntu-installer-backend.ts'
      - 'crabot-desktop/src/ubuntu-installer-removal.ts'
      - 'crabot-desktop/tests/ubuntu-installer-removal.test.mjs'
      - 'crabot-desktop/tests/fixtures/ubuntu-installer-removal-actor.mjs'
      - 'scripts/lib/desktop-removal-installer.mjs'
      - 'crabot-desktop/src/removal-source.ts'
      - 'crabot-desktop/tests/removal-frame.test.mjs'
      - 'crabot-desktop/tests/fixtures/removal-frame-actor.cjs'
      - 'crabot-desktop/src/removal-operation.ts'
      - 'crabot-desktop/src/removal-request.ts'
      - 'crabot-desktop/src/installation-removal.ts'
      - 'scripts/desktop/ubuntu-maintenance-main.mjs'
      - 'crabot-desktop/src/ubuntu-process.ts'
      - 'crabot-desktop/src/operation-progress.ts'
      - 'crabot-desktop/tests/ubuntu-removal-progress.test.mjs'
      - 'crabot-desktop/tests/ubuntu-removal-host.test.mjs'
      - 'scripts/lib/desktop-removal-host.mjs'
      - 'scripts/lib/desktop-removal-frame.mjs'
      - 'scripts/lib/desktop-removal-job.mjs'
      - 'scripts/lib/desktop-removal-source.mjs'
      - 'crabot-desktop/tests/fixtures/ubuntu-removal-node-parent.cjs'
      - 'crabot-desktop/tests/fixtures/removal-progress-peer.c'
      - 'crabot-native/**'
      - 'scripts/build-native.mjs'
      - 'scripts/desktop/build-ubuntu-installer.mjs'
      - 'scripts/desktop/package-ubuntu-installer.mjs'
      - 'scripts/desktop/ubuntu-bootstrap.test.mjs'
      - 'scripts/desktop/ubuntu-maintenance-backend*'
      - 'scripts/lib/desktop-maintenance-bootstrap.mjs'
      - '.github/workflows/desktop-ubuntu-bootstrap.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ubuntu-bootstrap:
    name: Build Ubuntu24 native bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Prepare native compiler and Ubuntu24 desktop headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libjson-glib-dev xvfb xauth dbus-x11
      - name: Compile fixed helper and GTK frontend from this clean commit
        run: node scripts/desktop/build-ubuntu-installer.mjs .desktop-build/ubuntu-bootstrap
      - name: Actual GTK maintenance display and bounded cancellation
        timeout-minutes: 2
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 crabot-desktop/tests/native/ubuntu-maintenance.c -o .desktop-build/ubuntu-maintenance-test $(pkg-config --cflags --libs gtk4 json-glib-1.0)
          timeout 20s dbus-run-session -- xvfb-run -a .desktop-build/ubuntu-maintenance-test
          timeout 20s dbus-run-session -- xvfb-run -a .desktop-build/ubuntu-bootstrap/crabot-maintenance --smoke-test
          cc -std=c11 -Wall -Wextra -Werror -O2 crabot-desktop/native/ubuntu/installer-lifecycle.test.c -o .desktop-build/ubuntu-installer-lifecycle-test $(pkg-config --cflags --libs gtk4 json-glib-1.0)
          timeout 20s dbus-run-session -- xvfb-run -a .desktop-build/ubuntu-installer-lifecycle-test
      - name: Build the same-source Node identity and display modules
        run: |
          node scripts/build-native.mjs
          pnpm --dir crabot-client install --frozen-lockfile
          node crabot-client/node_modules/typescript/bin/tsc -p crabot-client/tsconfig.json
          pnpm install --frozen-lockfile
          pnpm --dir crabot-desktop install --frozen-lockfile
          (cd crabot-desktop && node -e "require('electron')")
          node crabot-desktop/node_modules/typescript/bin/tsc -p crabot-desktop/tsconfig.json
          (cd crabot-desktop && node build-preload.mjs)
          node --test scripts/lib/__tests__/removal-copy-cleanup.test.mjs scripts/desktop/ubuntu-maintenance-backend.test.mjs crabot-desktop/tests/ubuntu-installer-removal.test.mjs
      - name: Actual private Node-to-GTK window handoff without business services
        timeout-minutes: 2
        env:
          CRABOT_GTK_FRONTEND: ${{ github.workspace }}/.desktop-build/ubuntu-bootstrap/crabot-maintenance
        run: timeout 90s dbus-run-session -- xvfb-run -a node --test crabot-desktop/tests/ubuntu-removal-progress.test.mjs
      - name: Actual GUI source hands off to the native GTK and Node uninstall owner
        timeout-minutes: 3
        env:
          CRABOT_GTK_FRONTEND: ${{ github.workspace }}/.desktop-build/ubuntu-bootstrap/crabot-maintenance
          CRABOT_GTK_ACTOR: ${{ github.workspace }}/.desktop-build/crabot-maintenance-actor
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -DCRABOT_MAINTENANCE_ACTOR crabot-desktop/tests/native/ubuntu-maintenance.c -o .desktop-build/crabot-maintenance-actor $(pkg-config --cflags --libs gtk4 json-glib-1.0)
          timeout 150s dbus-run-session -- xvfb-run -a node --test --test-name-pattern=publish-source-remove-source crabot-desktop/tests/removal-frame.test.mjs
      - name: Verify private Node hosts and offline installer continuation
        timeout-minutes: 3
        env:
          CRABOT_GTK_FRONTEND: ${{ github.workspace }}/.desktop-build/ubuntu-bootstrap/crabot-maintenance
        run: node --test crabot-desktop/tests/ubuntu-removal-host.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-native-bootstrap
          path: .desktop-build/ubuntu-bootstrap
          retention-days: 3
