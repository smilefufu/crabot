name: Workspace lifecycle contracts and maintenance observations

on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-workspace-lifecycle-contracts']
    paths: ['crabot-shared/**', 'crabot-native/**', 'scripts/build-native.mjs', '.github/workflows/workspace-lifecycle-contracts.yml']
  pull_request:
    paths: ['crabot-shared/**', 'crabot-native/**', 'scripts/build-native.mjs', '.github/workflows/workspace-lifecycle-contracts.yml']

permissions:
  contents: read
concurrency:
  group: workspace-lifecycle-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Compile the declared Native dependency from this checkout
        run: node scripts/build-native.mjs
      - name: Install only the Shared package frozen dependencies
        run: pnpm -C crabot-shared install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/crabot-workspace-pnpm"
      - name: Build Shared without any GUI or business dist
        run: node crabot-shared/node_modules/typescript/bin/tsc -p crabot-shared/tsconfig.json
      - name: Run complete Shared baseline and workspace behavior
        run: node --import ./crabot-shared/node_modules/tsx/dist/loader.mjs --test --test-concurrency=1 crabot-shared/src/*.test.ts
      - name: Same-device bind mounts remain outside one scanned workspace
        if: runner.os == 'Linux'
        run: sudo --preserve-env=GITHUB_ACTIONS unshare --mount --propagation private -- "$(command -v node)" --import ./crabot-shared/node_modules/tsx/dist/loader.mjs --test --test-name-pattern='Linux same-device bind mounts' crabot-shared/src/workspace-usage.test.ts
