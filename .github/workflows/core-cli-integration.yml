name: Core and existing CLI integration
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-core-cli-integration']
  pull_request:
    paths:
      - 'cli.mjs'
      - 'src/cli/**'
      - 'scripts/start.mjs'
      - 'scripts/stop.mjs'
      - 'scripts/supervisor.mjs'
      - 'scripts/lib/*python*'
      - 'scripts/lib/*maintenance*'
      - '.github/workflows/core-cli-integration.yml'
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Prepare the fixed real Python test distribution
        run: uv python install 3.12.12
      - name: Build only this checkout's actual dependencies and modules
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:cli
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          pnpm --dir crabot-admin install --frozen-lockfile --ignore-scripts
          pnpm --dir scripts/lib install --frozen-lockfile --ignore-scripts
          node scripts/build-native.mjs
      - name: Prepare finite offline Python fixtures without a full desktop runtime
        run: node .github/scripts/prepare-legacy-python-test-runtime.mjs
      - name: Verify existing CLI HTTP compatibility
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --minWorkers=1
      - name: Verify historical execution evidence without activating relocation
        working-directory: crabot-agent
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/workers/harness/workspace-legacy-executions.test.ts
          tests/workers/harness/workspace-relocation-scope.test.ts
          --maxWorkers=1 --minWorkers=1
      - name: Verify scoped maintenance and pre-start preparation
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/core-preparation.test.mjs
          scripts/lib/__tests__/maintenance-backup.test.mjs
          scripts/lib/__tests__/version-maintenance.test.mjs
          scripts/lib/__tests__/legacy-version-maintenance.test.mjs
          scripts/lib/__tests__/workspace-legacy-executions.test.mjs
          scripts/lib/__tests__/system-startup-data.test.mjs
      - name: Verify actual finite foreground and background ownership
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/background-core.test.mjs
          scripts/lib/__tests__/supervisor-bootstrap.test.mjs
          scripts/lib/__tests__/mm-startup.test.mjs
          scripts/lib/__tests__/stop-windows.test.mjs
      - name: Verify offline Python rebuild, default selection and existing password input
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/cli-installation.test.mjs
          scripts/lib/__tests__/cli-password-input.test.mjs
          scripts/lib/__tests__/legacy-python.test.mjs
          scripts/lib/__tests__/legacy-python-rebuild.test.mjs
          scripts/lib/__tests__/legacy-python-maintenance.test.mjs
          scripts/lib/__tests__/agent-python-selection.test.mjs
      - name: Verify old process compatibility and bounded source downloads
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/legacy-runtime.test.mjs
          scripts/lib/__tests__/legacy-stop.test.mjs
          scripts/lib/__tests__/legacy-system-account.test.mjs
          scripts/lib/__tests__/legacy-system-runtime.test.mjs
          scripts/lib/__tests__/install-network.test.mjs
      - name: Verify actual compiled MM startup and upgrade entry contracts
        working-directory: scripts/upgrade-lib
        run: >-
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mjs
          __tests__/cli-lock-recovery.test.mjs
          __tests__/prepared-upgrade.test.mjs
          __tests__/startup-entry.test.mjs
          --maxWorkers=1 --minWorkers=1
