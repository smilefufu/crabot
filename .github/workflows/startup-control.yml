name: Shared startup control
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-startup-control']
  pull_request:
    paths:
      - 'scripts/lib/*preflight*'
      - 'scripts/lib/cli-lock.mjs'
      - 'scripts/lib/workspace-maintenance.cjs'
      - 'scripts/start.mjs'
      - 'scripts/restart.mjs'
      - 'scripts/ui-upgrade.mjs'
      - 'crabot-core/src/main.ts'
      - '.github/workflows/startup-control.yml'
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's SDK, Shared, Core and Native
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir scripts/lib install --frozen-lockfile --ignore-scripts
          node scripts/build-native.mjs
      - name: Verify actual OS mutexes and interrupted finite startup checks
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/cli-lock-native.test.mjs
          scripts/lib/__tests__/core-preflight.test.mjs
      - name: Preserve existing upgrade locking and prepared switch behavior
        working-directory: scripts/upgrade-lib
        run: >-
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mjs
          __tests__/cli-lock-recovery.test.mjs __tests__/prepared-upgrade.test.mjs __tests__/startup-entry.test.mjs
          --maxWorkers=1 --minWorkers=1
