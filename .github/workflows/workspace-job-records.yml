name: Workspace fixed job and recovery records
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-workspace-job-records']
  pull_request:
    paths:
      - 'scripts/lib/workspace-relocation-intent.mjs'
      - 'scripts/lib/workspace-*-records.mjs'
      - 'scripts/lib/workspace-recovery-*.mjs'
      - 'scripts/lib/cli-lock.mjs'
      - '.github/workflows/workspace-job-records.yml'
permissions:
  contents: read
jobs:
  records:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build only this checkout's actual dependencies and record consumers
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          node scripts/build-native.mjs
      - name: Verify original target preview and maintenance boundaries
        working-directory: crabot-shared
        run: >-
          node --import tsx --test --test-concurrency=1
          src/workspace-relocation-target.test.ts src/workspace-maintenance.test.ts
      - name: Verify original execution retirement facts
        working-directory: crabot-agent
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/core/workspace-relocation-retirements.test.ts
          --maxWorkers=1 --minWorkers=1
      - name: Verify private fixed scopes, journals, actual locks and cold readers
        run: node --test --test-concurrency=1 scripts/lib/__tests__/workspace-relocation-intent.test.mjs
