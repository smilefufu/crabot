name: Workspace fixed actors and original CLI carriers
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-workspace-fixed-actors']
  pull_request:
    paths:
      - 'scripts/lib/workspace-*-journal.mjs'
      - 'scripts/lib/workspace-coordinator-*.mjs'
      - 'scripts/lib/workspace-file-*.mjs'
      - 'scripts/workspace-relocation-coordinator.mjs'
      - 'scripts/workspace-file-host.mjs'
      - 'crabot-agent/src/workers/harness/harness.ts'
      - '.github/workflows/workspace-fixed-actors.yml'
permissions:
  contents: read
jobs:
  actors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build only this checkout's actual modules and fixed Native actors
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir scripts/lib install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-agent run build
          node scripts/build-native.mjs
      - name: Verify actual finite coordinator, file Host and per-action journals
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/workspace-coordinator-entry.test.mjs
          scripts/lib/__tests__/workspace-coordinator-launch.test.mjs
          scripts/lib/__tests__/workspace-copy-job.test.mjs
          scripts/lib/__tests__/tmux-process-tree.test.mjs
      - name: Verify both original CLI carriers, Harness closure and background execution admission
        working-directory: crabot-agent
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/core/execution-admissions.test.ts
          tests/workers/headless-native-processes.test.ts
          tests/workers/native-process-observation.test.ts
          tests/workers/relocated-native-history.test.ts
          tests/workers/codex-app-server-client.test.ts
          tests/workers/tmux-driver.test.ts
          tests/workers/harness/harness-lifecycle.test.ts
          tests/workers/harness/workspace-manager.test.ts
          tests/workers/harness/project-workspaces.test.ts
          tests/manager/project-doc-tools.test.ts
          tests/engine/bg-entities/registry.test.ts
          tests/engine/bg-entities/bg-shell.test.ts
          tests/engine/host-process-maintenance.test.ts
          tests/engine/host-process.test.ts
          --maxWorkers=1 --minWorkers=1
