name: Core bundled runtime integration
on:
  workflow_dispatch:
  push:
    branches: ['feat/desktop-core-runtime']
  pull_request:
    paths:
      - 'crabot-core/**'
      - 'scripts/run-product-memory.mjs'
      - 'scripts/lib/product-*.cjs'
      - 'scripts/lib/module-process-start.cjs'
      - 'scripts/lib/__tests__/module-process-start-core.test.mjs'
      - '.github/workflows/core-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Build this checkout's SDK, Shared, Core and Native only
        shell: bash
        run: |
          pnpm --dir crabot-client install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-client run build
          pnpm --dir crabot-shared install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-shared run build
          pnpm --dir crabot-core install --frozen-lockfile --ignore-scripts
          pnpm --dir crabot-core run build
          node scripts/build-native.mjs
      - name: Verify source compatibility, required resources and module environment isolation
        working-directory: crabot-core
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/agent-venv.test.ts src/core-modules.test.ts
          src/executable-resolver.test.ts src/module-runtime-registry.test.ts
          --maxWorkers=1 --minWorkers=1
      - name: Verify actual Core identity parity and offline environment primitives
        run: >-
          node --test --test-concurrency=1
          scripts/lib/__tests__/module-process-start-core.test.mjs
          scripts/lib/__tests__/product-runtime.test.mjs
          scripts/lib/__tests__/product-agent-env.test.mjs
          scripts/lib/__tests__/agent-python-selection.test.mjs
          scripts/lib/__tests__/core-release.test.mjs
