# Qualification-only VM. Run with a separate LIMA_HOME and cache directory.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
cpus: 4
memory: 12GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
mounts: []
networks: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
  overVsock: true
containerd:
  system: false
  user: false
portForwards:
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
networkOpts:
  hostLoopback: false
propagateProxyEnv: false
env:
  http_proxy: ""
  https_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  all_proxy: ""
  ALL_PROXY: ""
user:
  name: qualifier
  comment: Crabot qualification fixture
